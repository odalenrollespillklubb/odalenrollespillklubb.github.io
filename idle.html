<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Venteskjerm. Ingen lenker hit fra resten av siden. -->
<meta name="robots" content="noindex, nofollow">
<title>ORK – venteskjerm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Noto+Sans+Runic&display=swap" rel="stylesheet">
<style>
:root{
  --umber:#17110f; --soot:#0d0908; --candle:#e8b45a; --ember:#f08a3c;
  --arcane:#7fd1c7; --bone:#d9cfbd; --blood:#b8402f;
  --serif:"IM Fell English", Georgia, "Times New Roman", serif;
  --serif-sc:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --runic:"Noto Sans Runic", "Segoe UI Historic", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --umber:#17110f; --soot:#0d0908; --bone:#d9cfbd; } }
:root[data-theme="dark"]{ --umber:#17110f; --soot:#0d0908; --bone:#d9cfbd; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; }
body{
  background:var(--soot); color:var(--bone); overflow:hidden;
  font-family:var(--serif); cursor:default;
}
body.hide-cursor{ cursor:none; }

/* Scene layers */
.scene{ position:fixed; inset:0; overflow:hidden;
  background:radial-gradient(ellipse 70% 60% at 50% 48%, #2a1c15 0%, var(--umber) 45%, var(--soot) 100%); }
.fog{ position:absolute; inset:-25%; pointer-events:none; filter:blur(40px); opacity:.55; }
.fog.a{ background:
  radial-gradient(closest-side at 30% 40%, rgba(127,209,199,.10), transparent),
  radial-gradient(closest-side at 70% 65%, rgba(232,180,90,.10), transparent);
  animation:drift 48s ease-in-out infinite alternate; }
.fog.b{ background:
  radial-gradient(closest-side at 60% 30%, rgba(184,64,47,.08), transparent),
  radial-gradient(closest-side at 25% 75%, rgba(127,209,199,.07), transparent);
  animation:drift 63s ease-in-out infinite alternate-reverse; }
@keyframes drift{ from{ transform:translate(-4%,2%) rotate(0deg) } to{ transform:translate(5%,-3%) rotate(8deg) } }
#embers{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.vignette{ position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.75) 100%); }

/* Centre piece */
.stage{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
.ring{ position:absolute; width:min(88vmin,960px); aspect-ratio:1; }
.ring svg{ width:100%; height:100%; overflow:visible; }
.ring .outer{ transform-origin:50% 50%; animation:spin 180s linear infinite; }
.ring .inner{ transform-origin:50% 50%; animation:spin 240s linear infinite reverse; }
.ring text{ font-family:var(--runic); fill:var(--candle); }
.ring .outer text{ opacity:.42; }
.ring .inner text{ fill:var(--arcane); opacity:.28; }
.ring circle{ fill:none; stroke:var(--candle); }
@keyframes spin{ to{ transform:rotate(360deg) } }

.logo{ position:relative; width:min(80vmin,880px); height:auto;
  filter:drop-shadow(0 0 10px rgba(232,180,90,.45)) drop-shadow(0 0 40px rgba(240,138,60,.25));
  animation:breathe 7s ease-in-out infinite, flicker 3.1s steps(1) infinite; }
@keyframes breathe{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.015) } }
@keyframes flicker{ 0%{opacity:1} 23%{opacity:.94} 26%{opacity:1} 61%{opacity:.97} 64%{opacity:1} }

/* Rumours */
.rumour{ position:absolute; left:50%; bottom:max(7vh,calc(env(safe-area-inset-bottom,0px) + 3rem));
  transform:translateX(-50%); width:min(90vw,44rem); text-align:center; pointer-events:none;
  font-style:italic; font-size:clamp(1.15rem,2.6vmin,1.9rem); line-height:1.45; color:var(--bone);
  text-shadow:0 0 18px rgba(232,180,90,.35); }
.rumour .lead{ display:block; font-family:var(--serif-sc); font-style:normal; color:var(--candle);
  font-size:.72em; letter-spacing:.04em; margin-bottom:.35em; opacity:.85; }
.rumour span.ch{ opacity:0; transition:opacity .5s ease; }
.rumour span.ch.on{ opacity:1; }
.rumour.out{ transition:opacity 1.6s ease, filter 1.6s ease; opacity:0; filter:blur(6px); }

/* Clock */
.clock{ position:absolute; right:3vmin; bottom:max(3vmin,env(safe-area-inset-bottom,0px));
  font-family:var(--serif-sc); font-size:clamp(1rem,2.2vmin,1.6rem); color:var(--candle); opacity:.55;
  font-variant-numeric:oldstyle-nums; }

/* Hint */
.hint{ position:absolute; top:max(2.5vmin,env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);
  font-size:clamp(.85rem,1.6vmin,1.05rem); color:var(--bone); opacity:.6; transition:opacity 1.5s ease; white-space:nowrap; }
.hint.gone{ opacity:0; }
.hint kbd{ font-family:var(--serif); border:1px solid rgba(217,207,189,.35); border-radius:3px; padding:0 .35em; }

/* Event actors */
.actor{ position:absolute; pointer-events:none; will-change:transform,opacity; }
.die svg{ width:100%; height:100%; overflow:visible; }
.die .face{ fill:rgba(23,17,15,.85); stroke:var(--candle); stroke-width:2.2; stroke-linejoin:round; }
.die .edge{ stroke:var(--candle); stroke-width:1.4; opacity:.75; }
.die .num{ font-family:var(--serif-sc); fill:var(--bone); font-size:22px; text-anchor:middle; dominant-baseline:central; }
.die.crit .face{ stroke:#ffd98a; filter:drop-shadow(0 0 10px #ffd98a); }
.die.fumble .face{ stroke:var(--blood); }
.die.fumble .num{ fill:var(--blood); }
.verdict{ position:absolute; transform:translate(-50%,0); white-space:nowrap; pointer-events:none;
  font-family:var(--serif-sc); font-size:clamp(1.3rem,3.4vmin,2.6rem); }
.verdict.crit{ color:#ffd98a; text-shadow:0 0 20px rgba(255,217,138,.7); }
.verdict.fumble{ color:var(--blood); text-shadow:0 0 16px rgba(184,64,47,.6); }
.shock{ position:absolute; border-radius:50%; border:2px solid #ffd98a; pointer-events:none; transform:translate(-50%,-50%); }

.rain svg{ width:100%; height:100%; overflow:visible; }
.rain .face{ fill:none; stroke:var(--candle); stroke-width:2; stroke-linejoin:round; }
.rain .edge{ stroke:var(--candle); stroke-width:1.2; opacity:.6; fill:none; }

.sigil svg{ width:100%; height:100%; overflow:visible; }
.sigil path, .sigil circle, .sigil polygon{ fill:none; stroke:var(--arcane); stroke-width:1.2;
  filter:drop-shadow(0 0 4px var(--arcane)); }
.sigil text{ font-family:var(--runic); fill:var(--arcane); font-size:7px; text-anchor:middle; dominant-baseline:central; }

.eyes{ display:flex; gap:1.2em; }
.eyes i{ display:block; width:1.4em; height:.5em; border-radius:50%;
  background:radial-gradient(ellipse at center, #fff3b0 0%, #e8b45a 40%, rgba(232,180,90,0) 72%);
  transform-origin:50% 50%; }
.eyes i:first-child{ transform:rotate(8deg) } .eyes i:last-child{ transform:rotate(-8deg) }

.missile{ width:14px; height:14px; border-radius:50%;
  background:radial-gradient(circle, #fff 0%, var(--arcane) 45%, rgba(127,209,199,0) 70%);
  box-shadow:0 0 18px 6px rgba(127,209,199,.45); }

@media (prefers-reduced-motion: reduce){
  .ring .outer, .ring .inner, .fog, .logo{ animation:none; }
}
</style>

<script>
(() => {
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const scene = document.getElementById('scene');
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Rune rings ---------- */
const futhark = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ';
// Outer: ODALEN ROLLESPILLKLUBB. Inner: RULL FOR INITIATIV.
// Doubled letters are written once, as in historical inscriptions. ᛫ separates words.
const OUTER = 'ᛟᛞᚨᛚᛖᚾ ᛫ ᚱᛟᛚᛖᛊᛈᛁᛚᚲᛚᚢᛒ  ✦  ';
const INNER = 'ᚱᚢᛚ ᛫ ᚠᛟᚱ ᛫ ᛁᚾᛁᛏᛁᚨᛏᛁᚹ  ✦  ';
document.getElementById('tOuter').textContent = OUTER.repeat(2);
document.getElementById('tInner').textContent = INNER.repeat(2);

/* ---------- Embers (canvas) ---------- */
const cv = document.getElementById('embers'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1; const motes=[]; const sparks=[];
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize', resize); resize();
const MOTES = reduced ? 18 : Math.round(Math.min(90, (W*H)/22000));
function spawnMote(initial){
  return { x:rand(0,W), y: initial?rand(0,H):H+rand(5,40), r:rand(.6,2.2), vy:rand(.15,.55),
    sway:rand(.3,1.2), ph:rand(0,Math.PI*2), life:rand(.4,1),
    hue: Math.random()<.18 ? 'arc' : 'fire' };
}
for(let i=0;i<MOTES;i++) motes.push(spawnMote(true));
function burst(x,y,color,count=60,speed=4){
  for(let i=0;i<count;i++){ const a=rand(0,Math.PI*2), s=rand(.5,speed);
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,decay:rand(.008,.02),r:rand(.8,2.4),color}); }
}
let t0=performance.now();
function frame(t){
  const dt=Math.min(3,(t-t0)/16.67); t0=t;
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const m of motes){
    m.y -= m.vy*dt; m.ph += .01*dt; m.x += Math.sin(m.ph)*m.sway*.3*dt;
    if(m.y < -20){ Object.assign(m, spawnMote(false)); }
    const fade = Math.min(1, m.y/(H*.35)) * m.life;
    const g = ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r*4);
    const c = m.hue==='arc' ? '127,209,199' : '240,160,80';
    g.addColorStop(0,`rgba(${c},${.9*fade})`); g.addColorStop(1,`rgba(${c},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(m.x,m.y,m.r*4,0,Math.PI*2); ctx.fill();
  }
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=.05*dt; s.vx*=.985; s.life-=s.decay*dt;
    if(s.life<=0){ sparks.splice(i,1); continue; }
    ctx.fillStyle=`rgba(${s.color},${s.life})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Dice shapes ---------- */
const DICE = {
  d20:`<polygon class="face" points="50,4 90,27 90,73 50,96 10,73 10,27"/>
       <path class="edge" d="M50,24 L78,68 L22,68 Z M50,24 L50,4 M50,24 L10,27 M50,24 L90,27 M78,68 L90,27 M78,68 L90,73 M78,68 L50,96 M22,68 L10,27 M22,68 L10,73 M22,68 L50,96"/>`,
  d6:`<polygon class="face" points="50,6 90,26 90,72 50,94 10,72 10,26"/>
      <path class="edge" d="M10,26 L50,46 L90,26 M50,46 L50,94"/>`,
  d4:`<polygon class="face" points="50,6 94,86 6,86"/><path class="edge" d="M50,6 L50,62 L94,86 M50,62 L6,86"/>`,
  d8:`<polygon class="face" points="50,4 88,50 50,96 12,50"/><path class="edge" d="M12,50 L88,50 M50,4 L32,50 L50,96 M50,4 L68,50 L50,96"/>`,
  d10:`<polygon class="face" points="50,4 92,44 50,96 8,44"/><path class="edge" d="M8,44 L30,54 L50,46 L70,54 L92,44 M50,4 L50,46 M30,54 L50,96 M70,54 L50,96"/>`,
  d12:`<polygon class="face" points="50,4 92,32 80,84 20,84 8,32"/><polygon class="edge" points="50,24 70,40 63,64 37,64 30,40"/><path class="edge" d="M50,4 L50,24 M92,32 L70,40 M80,84 L63,64 M20,84 L37,64 M8,32 L30,40"/>`
};
const svgDie = (kind, extra='') => `<svg viewBox="0 0 100 100">${DICE[kind]}${extra}</svg>`;

function addActor(cls, html, css){
  const el=document.createElement('div'); el.className='actor '+cls; el.innerHTML=html;
  Object.assign(el.style, css); scene.appendChild(el); return el;
}

/* ---------- Events ---------- */
async function rollD20(){
  const size = Math.min(W,H)*.13;
  const fromLeft = Math.random()<.5;
  const lx = fromLeft ? rand(W*.62,W*.82) : rand(W*.18,W*.38);
  const ly = rand(H*.62,H*.74);
  const el = addActor('die', svgDie('d20','<text class="num" x="50" y="56">20</text>'),
    {width:size+'px',height:size+'px',left:(lx-size/2)+'px',top:(ly-size/2)+'px'});
  const num = el.querySelector('.num');
  const flick = setInterval(()=>{ num.textContent=randi(1,20); }, 70);
  const dx = (fromLeft?-1:1)*(W*.7), spin=(fromLeft?1:-1)*rand(720,1080);
  if(!reduced){
    await el.animate([
      {transform:`translate(${dx}px,${-H*.25}px) rotate(${-spin}deg) scale(.7)`,opacity:0},
      {opacity:1,offset:.15},
      {transform:`translate(${dx*.35}px,0) rotate(${-spin*.35}deg) scale(1)`,offset:.55},
      {transform:`translate(${dx*.12}px,${-size*.35}px) rotate(${-spin*.1}deg)`,offset:.75},
      {transform:`translate(0,0) rotate(0deg) scale(1)`}
    ],{duration:1700,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'}).finished;
  } else { await el.animate([{opacity:0},{opacity:1}],{duration:600,fill:'forwards'}).finished; }
  clearInterval(flick);
  // A little weighted luck: crits a bit more common than fair, for the show.
  const r = Math.random(); const val = r<.09 ? 20 : r<.15 ? 1 : randi(2,19);
  num.textContent = val;
  if(val===20){
    el.classList.add('crit'); burst(lx,ly,'255,217,138',90,6);
    const sh = addActor('shock','',{left:lx+'px',top:ly+'px',width:'10px',height:'10px'});
    sh.animate([{width:'10px',height:'10px',opacity:1},{width:size*4+'px',height:size*4+'px',opacity:0}],{duration:1100,easing:'ease-out'}).finished.then(()=>sh.remove());
    verdict('Kritisk treff!','crit',lx,ly+size*.65);
  } else if(val===1){
    el.classList.add('fumble'); burst(lx,ly,'184,64,47',35,2.5);
    el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300,iterations:2});
    verdict('Kritisk bom.','fumble',lx,ly+size*.65);
  } else {
    burst(lx,ly,'240,180,90',14,1.6);
  }
  await wait(3400);
  await el.animate([{opacity:1},{opacity:0,filter:'blur(4px)'}],{duration:1200,fill:'forwards'}).finished;
  el.remove();
}
function verdict(text,cls,x,y){
  const v=addActor('verdict '+cls,text,{left:x+'px',top:y+'px'});
  v.animate([{opacity:0,transform:'translate(-50%,10px)'},{opacity:1,transform:'translate(-50%,0)'}],{duration:500,fill:'forwards'});
  setTimeout(()=>v.animate([{opacity:1},{opacity:0}],{duration:1200,fill:'forwards'}).finished.then(()=>v.remove()),3400);
}

async function diceRain(){
  const kinds=Object.keys(DICE); const n = reduced?4:randi(7,12); const jobs=[];
  for(let i=0;i<n;i++){
    const s=Math.min(W,H)*rand(.04,.08); const x=rand(0,W-s);
    const el=addActor('rain',svgDie(pick(kinds)),{width:s+'px',height:s+'px',left:x+'px',top:(-s*1.5)+'px',opacity:0});
    const rot=rand(-540,540), drift=rand(-80,80);
    jobs.push(wait(i*rand(120,320)).then(()=>el.animate([
      {transform:'translate(0,0) rotate(0deg)',opacity:0},
      {opacity:.75,offset:.12},{opacity:.6,offset:.8},
      {transform:`translate(${drift}px,${H+s*3}px) rotate(${rot}deg)`,opacity:0}
    ],{duration:rand(4200,6500),easing:'cubic-bezier(.45,0,.75,1)',fill:'forwards'}).finished).then(()=>el.remove()));
  }
  await Promise.all(jobs);
}

async function sigil(){
  const s=Math.min(W,H)*rand(.2,.28);
  const corners=[[.14,.22],[.86,.22],[.14,.78],[.86,.78]]; const [cx,cy]=pick(corners);
  const x=W*cx-s/2, y=H*cy-s/2;
  // {7/3} star
  const pts=[]; for(let i=0;i<7;i++){ const a=-Math.PI/2+i*(2*Math.PI/7)*3; pts.push((50+34*Math.cos(a)).toFixed(2)+','+(50+34*Math.sin(a)).toFixed(2)); }
  let runes=''; for(let i=0;i<7;i++){ const a=-Math.PI/2+i*2*Math.PI/7; runes+=`<text x="${(50+42*Math.cos(a)).toFixed(1)}" y="${(50+42*Math.sin(a)).toFixed(1)}">${[...'ᛏᛖᚱᚾᛁᚾᚷ'][i]}</text>`; }
  const el=addActor('sigil',`<svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="47" pathLength="100"/><circle cx="50" cy="50" r="37" pathLength="100"/>
    <polygon points="${pts.join(' ')}" pathLength="100"/><circle cx="50" cy="50" r="9" pathLength="100"/>${runes}</svg>`,
    {width:s+'px',height:s+'px',left:x+'px',top:y+'px'});
  const lines=el.querySelectorAll('circle,polygon'), texts=el.querySelectorAll('text');
  texts.forEach(t=>t.style.opacity=0);
  const draws=[...lines].map((l,i)=>{ l.style.strokeDasharray='100'; l.style.strokeDashoffset='100';
    return l.animate([{strokeDashoffset:100},{strokeDashoffset:0}],{duration:reduced?400:1800,delay:i*350,easing:'ease-in-out',fill:'forwards'}).finished; });
  texts.forEach((t,i)=>t.animate([{opacity:0},{opacity:1}],{duration:500,delay:1200+i*150,fill:'forwards'}));
  el.animate([{transform:'rotate(0deg)'},{transform:'rotate(40deg)'}],{duration:9000,easing:'linear',fill:'forwards'});
  await Promise.all(draws); await wait(2600);
  burst(x+s/2,y+s/2,'127,209,199',40,2.2);
  await el.animate([{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(8px)',transform:'scale(1.15) rotate(40deg)'}],{duration:1600,fill:'forwards'}).finished;
  el.remove();
}

const RUMOURS = [
  'En drage skal visstnok sove under spillebordet.',
  'Bardens siste sang ble en kritisk bom. Igjen.',
  'Spillederen har alltid rett. Nesten alltid.',
  'Noen mener snacksbollen er en mimic. Ingen har turt å sjekke.',
  'Ingen plan overlever møtet med spillerne.',
  'En goblin står i døra og spør om medlemskap.',
  'Terningene er fortsatt varme etter forrige økt.',
  'Det sies at én av d20-ene i skuffen er forbannet.',
  'Paladinen har lovet å ikke angripe flere dører.',
  'Kartet stemmer ikke. Det har det aldri gjort.',
  'Rull for initiativ. Ja, nå.',
  'Trollmannen leter fortsatt etter regelboka si.',
  'En tyv ble sett nær kakefatet. Rull for persepsjon.',
  'Eventyret begynner når alle har funnet en stol.',
  'Husk å spare spell slots til sjefsfighten.',
  'Velkommen til bords, eventyrer.'
];
const LEADS = ['Rykter fra tavernaen','Hvisket i skyggene','Skrevet på en bit pergament','Fra spillederens notater'];
let rumourBag=[];
async function rumour(){
  if(!rumourBag.length) rumourBag = RUMOURS.slice().sort(()=>Math.random()-.5);
  const text = rumourBag.pop();
  const box=document.getElementById('rumour'); box.className='rumour'; box.innerHTML='';
  const lead=document.createElement('span'); lead.className='lead'; lead.textContent=pick(LEADS); lead.style.opacity=0; box.appendChild(lead);
  lead.animate([{opacity:0},{opacity:.85}],{duration:800,fill:'forwards'});
  const chars=[...text].map(c=>{ const s=document.createElement('span'); s.className='ch'; s.textContent=c; box.appendChild(s); return s; });
  await wait(500);
  for(const c of chars){ c.classList.add('on'); if(!reduced) await wait(38); }
  await wait(6000);
  box.classList.add('out'); await wait(1700); box.innerHTML=''; box.className='rumour';
}

async function eyes(){
  const size=rand(14,26);
  const spots=[[rand(.04,.18),rand(.1,.9)],[rand(.82,.96),rand(.1,.9)],[rand(.1,.9),rand(.04,.12)]];
  const [ex,ey]=pick(spots);
  const el=addActor('eyes','<i></i><i></i>',{left:(W*ex)+'px',top:(H*ey)+'px',fontSize:size+'px',opacity:0});
  await el.animate([{opacity:0},{opacity:.9}],{duration:1400,fill:'forwards'}).finished;
  const lids=el.querySelectorAll('i');
  for(let b=0;b<2;b++){ await wait(rand(700,1500));
    await Promise.all([...lids].map(l=>l.animate([{scale:'1 1'},{scale:'1 .05'},{scale:'1 1'}],{duration:220}).finished)); }
  await wait(900);
  await el.animate([{opacity:.9},{opacity:0}],{duration:900,fill:'forwards'}).finished; el.remove();
}

async function magicMissile(){
  const fromLeft=Math.random()<.5;
  const y0=rand(H*.15,H*.4), y1=rand(H*.2,H*.5);
  const x0=fromLeft?-30:W+30, x1=fromLeft?W+30:-30;
  const jobs=[0,1,2].map(i=>{
    const el=addActor('missile','',{left:'0px',top:'0px'});
    const arc=rand(-H*.18,H*.18);
    const kf=[]; for(let k=0;k<=20;k++){ const p=k/20;
      const x=x0+(x1-x0)*p, y=y0+(y1-y0)*p+Math.sin(p*Math.PI)*arc+Math.sin(p*Math.PI*6+i)*8;
      kf.push({transform:`translate(${x}px,${y}px)`}); }
    let trail=setInterval(()=>{ const m=new DOMMatrixReadOnly(getComputedStyle(el).transform);
      sparks.push({x:m.m41+7,y:m.m42+7,vx:rand(-.3,.3),vy:rand(-.3,.3),life:.8,decay:.03,r:rand(.8,1.8),color:'127,209,199'}); },30);
    return wait(i*220).then(()=>el.animate(kf,{duration:reduced?1500:2600,easing:'ease-in-out',fill:'forwards'}).finished)
      .then(()=>{ clearInterval(trail); el.remove(); });
  });
  await Promise.all(jobs);
}

const EVENTS = [rollD20, rollD20, diceRain, sigil, rumour, rumour, eyes, magicMissile];
let last=null, busy=false, timer=null;
async function runEvent(){
  if(busy) return; busy=true; clearTimeout(timer);
  let ev; do{ ev=pick(EVENTS); } while(ev===last && EVENTS.length>1);
  last=ev;
  try{ await ev(); }catch(e){ console.error(e); }
  busy=false; schedule();
}
function schedule(){ clearTimeout(timer); timer=setTimeout(runEvent, rand(6000,13000)); }
setTimeout(runEvent, 3500);

/* ---------- Clock ---------- */
const clock=document.getElementById('clock');
function tick(){ const d=new Date(); clock.textContent=d.toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'}); }
tick(); setInterval(tick, 10000);

/* ---------- Controls ---------- */
const hint=document.getElementById('hint'); setTimeout(()=>hint.classList.add('gone'),8000);
function toggleFs(){
  try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }catch(e){}
}
document.addEventListener('click', toggleFs);
document.addEventListener('keydown', e=>{
  if(e.key==='f'||e.key==='F') toggleFs();
  if(e.key===' '){ e.preventDefault(); runEvent(); }
});
let idleT; function wake(){ document.body.classList.remove('hide-cursor'); clearTimeout(idleT);
  idleT=setTimeout(()=>document.body.classList.add('hide-cursor'),2500); }
document.addEventListener('mousemove', wake); wake();

/* Keep the screen awake where the browser allows it */
let lock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator) lock=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });
keepAwake();
})();
